<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Risk Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🌫️ Air Pollution Health Risk Predictor</h1>
        <p>Enter current gas and particulate concentrations, and our Random Forest model will predict the AQI and assess the health risk.</p>

        {% if error %}
        <p class="error">⚠️ Error: {{ error }}</p>
        {% endif %}

        <form action="/predict" method="POST">
            <label>CO (Carbon Monoxide, µg/m³):
                <input type="number" step="any" name="co" required>
            </label>
            <label>NO (Nitric Oxide, µg/m³):
                <input type="number" step="any" name="no" required>
            </label>
            <label>NO2 (Nitrogen Dioxide, µg/m³):
                <input type="number" step="any" name="no2" required>
            </label>
            <label>O3 (Ozone, µg/m³):
                <input type="number" step="any" name="o3" required>
            </label>
            <label>SO2 (Sulfur Dioxide, µg/m³):
                <input type="number" step="any" name="so2" required>
            </label>
            <label>PM2.5 (Particulates < 2.5µm, µg/m³):
                <input type="number" step="any" name="pm25" required>
            </label>
            <label>PM10 (Particulates < 10µm, µg/m³):
                <input type="number" step="any" name="pm10" required>
            </label>
            <label>NH3 (Ammonia, µg/m³):
                <input type="number" step="any" name="nh3" required>
            </label>
            <button type="submit">Predict AQI & Risk</button>
        </form>
    </div>
</body>
</html>
