<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Risk Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🌡️ Heat & Pollution Health Risk Predictor</h1>
        <p>Enter current environmental conditions to assess health risk.</p>

        {% if error %}
        <p class="error">⚠️ Error: {{ error }}</p>
        {% endif %}

        <form action="/predict" method="POST">
            <label>Temperature (°C):
                <input type="number" step="0.1" name="temperature" required>
            </label>
            <label>Humidity (%):
                <input type="number" step="0.1" name="humidity" required>
            </label>
            <label>AQI (Air Quality Index):
                <input type="number" step="0.1" name="aqi" required>
            </label>
            <label>PM2.5 (µg/m³):
                <input type="number" step="0.01" name="pm25" required>
            </label>
            <label>PM10 (µg/m³):
                <input type="number" step="0.01" name="pm10" required>
            </label>
            <button type="submit">Predict Risk</button>
        </form>
    </div>
</body>
</html>
